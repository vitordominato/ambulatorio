vaccines_rules:

  # ===================== RESPIRATÓRIAS =====================
  - id: vax_influenza
    title: Influenza (anual)
    condition: age >= 6 or is_health_worker or is_pregnant or dm or dpoc or cardiovascular_cronica or renal_cronica or hepatica_cronica or imunossuprimido
    schedule:
      - "Aplicar 1 dose anual (preferencialmente no início da sazonalidade)."
      - "Crianças <9 anos sem histórico podem requerer 2 doses no primeiro ano (0 e 4 semanas)."
    contraindications:
      - "Hipersensibilidade grave (anafilaxia) a componentes da vacina."
      - "Episódio de Síndrome de Guillain-Barré nas 6 semanas após dose prévia (avaliar risco/benefício)."
    sus_available: "Sim"
    references:
      - "MS/PNI 2024–2025 – Influenza"
      - "SBIm 2024 – Calendário de Adultos"
    notes:
      - "Indicar fortemente para gestantes e profissionais de saúde."

  - id: vax_pneumococica_adulto
    title: Pneumocócica (PCV20 OU PCV13→PPSV23)
    condition: age >= 60 or dm or dpoc or cardiovascular_cronica or renal_cronica or hepatica_cronica or imunossuprimido or smoker_or_ex
    schedule:
      - "Opção A: **PCV20** – dose única."
      - "Opção B (alternativa): **PCV13** dose única, seguida de **PPSV23** após 6–12 meses."
      - "Em imunossuprimidos e alto risco, considerar reforço de PPSV23 conforme diretrizes."
    contraindications:
      - "Hipersensibilidade grave a componentes das vacinas."
    sus_available: "Parcial"
    references:
      - "SBIm 2024 – Pneumocócicas em adultos"
      - "MS/PNI 2024–2025"
    notes:
      - "Fumar aumenta risco pneumocócico; considerar mesmo <60 anos com tabagismo."

  - id: vax_covid_adulto
    title: COVID-19 (reforços)
    condition: age >= 12 or is_pregnant or is_health_worker or dm or dpoc or cardiovascular_cronica or renal_cronica or hepatica_cronica or imunossuprimido
    schedule:
      - "Reforço periódico conforme faixa etária e risco (1x/ano para grupos de risco, conforme MS vigente)."
    contraindications:
      - "Reação anafilática a dose prévia ou componente da vacina."
    sus_available: "Sim"
    references:
      - "MS/PNI 2024–2025 – COVID-19"
      - "SBIm 2024 – Recomendações COVID-19"
    notes:
      - "Gestantes e profissionais de saúde: priorizar esquema atualizado."

  # ===================== DTP/TÉTANO/COQUELUCHE =====================
  - id: vax_dtpa_tetano
    title: dTpa (coqueluche, difteria, tétano) e Td (reforço)
    condition: age >= 12
    schedule:
      - "Aplicar **1 dose de dTpa** em adulto que nunca recebeu; depois **reforço com Td** a cada 10 anos."
      - "Gestantes: **1 dose de dTpa em cada gestação**, a partir de 20 semanas (ideal 27–36s)."
    contraindications:
      - "Anafilaxia prévia a componente."
      - "Doença febril moderada a grave: adiar."
    sus_available: "Sim"
    references:
      - "MS/PNI 2024–2025 – dTpa/Td"
      - "SBIm 2024 – Adultos e Gestantes"
    notes:
      - "Profissionais de saúde devem manter reforços em dia."

  # ===================== VIRAIS (TRÍPLICE, VARICELA, HPV) =====================
  - id: vax_mmr
    title: Tríplice viral (sarampo, caxumba, rubéola)
    condition: age >= 12 and not imunossuprimido and not is_pregnant
    schedule:
      - "Sem comprovação vacinal: **2 doses** com intervalo mínimo de 4 semanas (nascidos ≥1960)."
    contraindications:
      - "Gestação."
      - "Imunossupressão importante."
      - "Alergia grave a neomicina/gelatina."
    sus_available: "Sim"
    references:
      - "MS/PNI 2024–2025 – SCR"
      - "SBIm 2024 – Calendário Adulto"
    notes:
      - "Em profissionais de saúde, garantir 2 doses documentadas."

  - id: vax_varicela
    title: Varicela
    condition: age >= 12 and not imunossuprimido and not is_pregnant
    schedule:
      - "Sem história/vacinação prévia: **2 doses** (0 e 4–8 semanas)."
    contraindications:
      - "Gestação."
      - "Imunossupressão importante."
    sus_available: "Parcial"
    references:
      - "SBIm 2024 – Varicela em adultos"
      - "MS/PNI – disponibilidade local"
    notes:
      - "Profissionais de saúde sem comprovação: fortemente recomendado."

  - id: vax_hpv
    title: HPV
    condition: (age >= 9 and age <= 19) or imunossuprimido
    schedule:
      - "9–14 anos: **2 doses** (0 e 6–12 meses)."
      - "≥15 anos e imunossuprimidos: **3 doses** (0, 1–2, 6 meses)."
    contraindications:
      - "Gestação (adiar)."
      - "Anafilaxia prévia."
    sus_available: "Sim"
    references:
      - "MS/PNI 2024–2025 – HPV"
      - "SBIm 2024 – HPV"
    notes:
      - "Considerar ampliação etária conforme risco individual e disponibilidade local."

  # ===================== HEPATITES =====================
  - id: vax_hepatite_b
    title: Hepatite B
    condition: age >= 12
    schedule:
      - "Esquema **3 doses**: 0, 1 e 6 meses."
      - "Esquema acelerado pode ser usado em situações específicas."
    contraindications:
      - "Anafilaxia a componente (ex.: leveduras)."
    sus_available: "Sim"
    references:
      - "MS/PNI 2024–2025 – Hepatite B"
      - "SBIm 2024 – Adultos"
    notes:
      - "Profissionais de saúde devem comprovar esquema completo e sorologia quando aplicável."

  - id: vax_hepatite_a
    title: Hepatite A
    condition: hepatica_cronica or imunossuprimido
    schedule:
      - "Adultos suscetíveis: **2 doses** (0 e 6–12 meses)."
    contraindications:
      - "Anafilaxia a componente."
    sus_available: "Variável"
    references:
      - "SBIm 2024 – Hepatite A em adultos"
      - "MS/PNI – disponibilidade local"
    notes:
      - "Útil em hepatopatas crônicos, contatos e surtos."

  # ===================== DENGUE =====================
  - id: vax_dengue
    title: Dengue (TAK-003/Qdenga®)
    condition: age >= 6 and age <= 60 and not is_pregnant and not imunossuprimido
    schedule:
      - "**2 doses**: 0 e 3 meses."
      - "Verificar elegibilidade local (faixas etárias e critérios podem variar conforme MS/PNI vigente)."
    contraindications:
      - "Gestação."
      - "Imunossupressão importante."
      - "Anafilaxia a componente."
    sus_available: "Variável"
    references:
      - "MS/PNI 2024–2025 – Dengue (TAK-003)"
      - "SBIm 2024 – Dengue"
    notes:
      - "Recomendar após avaliação individual e normativa municipal/estadual."

  # ===================== OUTROS CONTEXTOS (TRABALHO/GRUPOS ESPECIAIS) =====================
  - id: vax_bundle_prof_saude
    title: Conjunto mínimo – Profissional de Saúde
    condition: is_health_worker
    schedule:
      - "Influenza anual."
      - "Hepatite B (3 doses, 0-1-6; checar anti-HBs)."
      - "dTpa (1 dose) + Td a cada 10 anos."
      - "Tríplice viral (2 doses documentadas)."
      - "Varicela (2 doses) se suscetível."
    contraindications:
      - "Respeitar contraindicações específicas de cada vacina do conjunto."
    sus_available: "Sim"
    references:
      - "MS/PNI 2024–2025 – Recomendações profissionais de saúde"
      - "SBIm 2024 – Trabalhadores da saúde"
    notes:
      - "Usar esta lista como checklist rápido; as vacinas individuais acima detalham esquemas."

  # ===================== GESTAÇÃO =====================
  - id: vax_bundle_gestante
    title: Conjunto mínimo – Gestante
    condition: is_pregnant
    schedule:
      - "dTpa: 1 dose em **cada gestação** (ideal 27–36 semanas)."
      - "Influenza: 1 dose em qualquer trimestre (sazonal)."
      - "Hepatite B: completar esquema se suscetível (0-1-6)."
    contraindications:
      - "Vacinas vivas atenuadas são contraindicadas na gestação (ex.: MMR, Varicela, Dengue TAK-003)."
    sus_available: "Sim"
    references:
      - "MS/PNI 2024–2025 – Gestantes"
      - "SBIm 2024 – Gestantes"
    notes:
      - "Avaliar necessidade de outras vacinas conforme risco ocupacional/epidemiológico."
