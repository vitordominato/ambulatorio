# =========================
# INFANTIS / PAEDIATRICS
# =========================

hepatite_b_infantil:
  label: "Hepatite B (infantil)"
  rules:
    - { field: "age", op: "<", value: 1 }   # até 11 meses (exibir no 1º ano)
  schedule: "3 doses (0, 1 e 6 meses). Em maternidade: 1ª dose ao nascer."
  refs:
    - "SBIm / Ministério da Saúde – Esquema infantil"
  contraindications:
    - "Anafilaxia a componentes (ex.: levedura)."

pentavalente_infantil:
  label: "Pentavalente (DTP + Hib + Hep B) — infantil"
  rules:
    - { field: "age", op: "<", value: 1 }
  schedule: "3 doses: 2, 4 e 6 meses; reforços conforme calendário local."
  refs:
    - "SBIm – Pentavalente"
  contraindications:
    - "Anafilaxia a dose anterior ou componente."
    - "Doença febril moderada a grave: adiar."

hexavalente_infantil:
  label: "Hexavalente (DTPa + Hib + Hep B + IPV) — infantil"
  rules:
    - { field: "age", op: "<", value: 1 }
  schedule: "3 doses: 2, 4 e 6 meses; reforços conforme produto e calendário."
  refs:
    - "SBIm – Hexavalente (rede privada)"
  contraindications:
    - "Anafilaxia a componente."
    - "Adiar se febre moderada/grave."

rotavirus_infantil:
  label: "Rotavírus — infantil"
  rules:
    - { field: "age", op: "<", value: 1 }
  schedule: "Vacina RV1 (2 doses: 2 e 4 meses; 1ª dose até 14s6d; 2ª até 7m29d) ou RV5 (3 doses: 2, 4, 6 meses; última até 8 meses). **Respeitar janelas etárias!**"
  refs:
    - "SBIm / MS – Rotavírus"
  contraindications:
    - "Invaginação intestinal prévia."
    - "Imunodeficiência combinada grave."
    - "Doença gastrointestinal aguda: adiar."

pcv13_infantil:
  label: "Pneumocócica conjugada 13-valente — infantil"
  rules:
    - { field: "age", op: "<", value: 5 }
  schedule: "Esquema sequencial conforme início (2+1 ou 3+1) segundo idade de início."
  refs:
    - "SBIm – PCV13 em crianças"
  contraindications:
    - "Anafilaxia a dose/componente."

pcv15_infantil:
  label: "Pneumocócica conjugada 15-valente — infantil"
  rules:
    - { field: "age", op: "<", value: 5 }
  schedule: "Esquema conforme idade de início; segue recomendações equivalentes à PCV."
  refs:
    - "SBIm – PCV15 em crianças"
  contraindications:
    - "Anafilaxia a dose/componente."

pcv20_infantil:
  label: "Pneumocócica 20-valente — infantil"
  rules:
    - { field: "age", op: "<", value: 6 }
  schedule: "Esquema conforme produto disponível/local; considerar substituição/integração a esquemas PCV."
  refs:
    - "SBIm 2025 – PCV20 pediátrica (onde disponível)"
  contraindications:
    - "Anafilaxia a dose/componente."

# =========================
# VSR — RÓTULOS ESPECÍFICOS (ADULTO)
# =========================

rsv_abrysvo_adulto:
  label: "Vírus sincicial respiratório — Abrysvo (adulto)"
  rules:
    - { field: "age", op: ">=", value: 60 }
  schedule: "1 dose única. Pode coadministrar com Influenza/COVID em locais distintos."
  refs:
    - "SBIm / ACIP — Abrysvo"
  contraindications:
    - "Reação alérgica grave a dose anterior."
    - "Adiar em doença febril aguda."

rsv_arexvy_adulto:
  label: "Vírus sincicial respiratório — Arexvy (adulto)"
  rules:
    - { field: "age", op: ">=", value: 60 }
  schedule: "1 dose única. Considerar prioridade a crônicos/imunossuprimidos."
  refs:
    - "SBIm / ACIP — Arexvy"
  contraindications:
    - "Reação alérgica grave a dose anterior."
    - "Adiar em doença febril aguda."

# =========================
# IMUNOPROFILAXIA (NÃO É VACINA)
# =========================

palivizumabe_info:
  label: "Palivizumabe (imunoprofilaxia anti-VSR) — lactentes de alto risco"
  rules:
    - { field: "age", op: "<", value: 2 }   # exibir em <2 anos para lembrar
  schedule: "5 doses mensais durante a sazonalidade, especialmente prematuros, DBP, cardiopatas congênitos, imunodeficiências — conforme protocolos MS/Instituição."
  refs:
    - "Ministério da Saúde / SBIm — Palivizumabe"
  contraindications:
    - "Anafilaxia a dose/componente."

