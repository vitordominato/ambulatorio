screening_rules:

  # ---- DIABETES / METABÓLICO ----
  - id: rastreio_diabetes
    title: Rastreamento de Diabetes Mellitus
    description: Glicemia de jejum e/ou HbA1c conforme fatores de risco.
    condition: imc_ge_25 or hipertensao_resistente or dislipidemia_ldl190
    actions:
      - Solicitar glicemia de jejum e HbA1c anual.
      - Considerar TOTG se glicemia limítrofe.
    references:
      - "Ministério da Saúde, Protocolo de Rastreamento de DM, 2022"
      - "USPSTF 2021 – Screening for Prediabetes and Type 2 Diabetes"

  # ---- LIPÍDIOS ----
  - id: rastreio_dislipidemia
    title: Rastreamento de Dislipidemia
    description: Avaliação de perfil lipídico para prevenção cardiovascular primária.
    condition: cardiovascular_cronica or dm or imc_ge_25 or smoker_or_ex
    actions:
      - Solicitar perfil lipídico (TC, HDL, LDL, TG) a cada 5 anos, ou anual se fatores de risco múltiplos.
      - Ajustar metas conforme risco global.
    references:
      - "SBPC/ML, Diretrizes Lipidológicas 2023"
      - "ACC/AHA Cholesterol Guidelines 2019"

  # ---- NEOPLASIAS ----
  - id: rastreio_mama
    title: Rastreamento de Câncer de Mama
    description: Mamografia de rastreamento conforme faixa etária e risco.
    condition: sex == "F" and age >= 40
    actions:
      - Solicitar mamografia a cada 2 anos (40–74 anos).
      - Antecipar se histórico familiar (famhx_mama).
    references:
      - "MS, Diretrizes Diagnóstico e Rastreamento de Câncer de Mama, 2022"
      - "USPSTF 2024 – Breast Cancer Screening"

  - id: rastreio_prostata
    title: Rastreamento de Câncer de Próstata
    description: Discussão individualizada sobre PSA.
    condition: sex == "M" and age >= 50
    actions:
      - Avaliar PSA anual após decisão compartilhada médico-paciente.
      - Antecipar para 45 anos se histórico familiar (famhx_prostata).
    references:
      - "SBUR/SBU Diretriz 2023"
      - "USPSTF 2018 – Prostate Cancer Screening"

  - id: rastreio_colorretal
    title: Rastreamento de Câncer Colorretal
    description: Pesquisa de sangue oculto ou colonoscopia conforme risco.
    condition: age >= 45
    actions:
      - Oferecer PSOF anual ou colonoscopia a cada 10 anos.
      - Antecipar se histórico familiar (famhx_colorretal).
    references:
      - "INCA, Diretriz de Rastreamento de CCR, 2022"
      - "USPSTF 2021 – Colorectal Cancer Screening"

  # ---- PULMONAR / TABAGISMO ----
  - id: rastreio_cancer_pulmao
    title: Rastreamento de Câncer de Pulmão
    description: Tomografia de baixa dose para tabagistas ou ex-tabagistas.
    condition: smoker_or_ex and age >= 50
    actions:
      - Considerar TC de baixa dose anual se ≥20 maços/ano e cessou há <15 anos.
    references:
      - "SBPT, Rastreamento de Câncer de Pulmão, 2023"
      - "NLST Trial, NEJM 2011"

  - id: protocolo_cardiologico_tabagismo
    title: Protocolo de Atendimento Ambulatorial Cardiológico – Tabagismo
    description: Avaliação de risco cardiovascular e prevenção secundária em tabagistas.
    condition: smoker_or_ex
    actions:
      - Ativar exibição automática do PDF de protocolo cardiológico.
      - Avaliar PA, perfil lipídico e glicemia.
    references:
      - "Protocolo interno – CHN 2025"

  # ---- HEPÁTICO / IMUNIZAÇÃO ----
  - id: rastreio_hepatico
    title: Rastreamento de Doença Hepática Crônica
    description: Avaliação de enzimas hepáticas em pacientes de risco.
    condition: hepatica_cronica or alcoolismo
    actions:
      - Solicitar TGO, TGP e USG abdominal conforme histórico clínico.
    references:
      - "SBH 2023 – Diretrizes Hepáticas"
      - "MS 2022 – Rastreamento Hepatites Virais"

  # ---- NEUROLÓGICO / VASCULAR ----
  - id: rastreio_aneurismas
    title: Rastreamento de Aneurismas Arteriais
    description: USG abdominal para AAA e avaliação familiar.
    condition: hist_aaa or hist_intracr
    actions:
      - Solicitar USG abdominal se histórico familiar de AAA.
      - Considerar angioRM/angioTC se familiar de aneurisma intracraniano.
    references:
      - "SVB, Diretriz de Doença Aneurismática, 2021"
